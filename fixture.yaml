- generic:
    time_range_1: 
      start: "2010-01-12 10:00:00"
      end: "2010-01-12 12:00:00"
      intervals : 1
      time_between_intervals: 0
    time_range_2: 
      start: "2010-01-12 10:30:00"
      end: "2010-01-12 10:45:00"
      intervals: 2
      time_between_intervals: 60
    expected: 
    - ("2010-01-12 10:30:00","2010-01-12 10:37:00")
    - ("2010-01-12 10:38:00", "2010-01-12 10:45:00")

- no_overlap:
    time_range_1: 
      start: "2010-01-12 10:00:00"
      end: "2010-01-12 11:00:00"
      intervals : 1
      time_between_intervals: 0
      
    time_range_2: 
      start: "2010-01-12 12:30:00"
      end: "2010-01-12 12:45:00"
      intervals : 2
      time_between_intervals: 60
    expected: []

- multiple_intervals:
    time_range_1: 
      start: "2010-01-12 10:00:00"
      end : "2010-01-12 13:00:00"
      intervals : 3
      time_between_intervals: 900
    time_range_2:
      start: "2010-01-12 10:40:00"
      end : "2010-01-12 11:20:00"
      intervals : 2
      time_between_intervals: 120
    expected: 
    - ("2010-01-12 10:40:00","2010-01-12 10:50:00")
    - ("2010-01-12 11:05:00", "2010-01-12 11:20:00")

- touching_edges:
    time_range_1: 
      start: "2010-01-12 10:00:00"
      end: "2010-01-12 11:00:00"
      intervals : 1
      time_between_intervals: 0
    time_range_2: 
      start: "2010-01-12 11:00:00"
      end: "2010-01-12 12:45:00"
      intervals : 1
      time_between_intervals: 0
    expected : []